# defects.yaml -- parametric defect-mask generation (week 05).
#
# Read by src/synthetic/config.py::load_defects_config. One binary mask per
# call to src/synthetic/mask_generation.py::generate_defect_mask: `count`
# instances (sampled from count_range), each a weighted-random shape from
# `shapes`, sized/positioned within this file's ranges. White (255) pixels
# mark the defect area -- the standard inpainting-mask convention day 3's
# diffusion_pipeline consumes.

seed: 42

# margin_fraction: keep every shape's full extent at least this fraction of
# the image's width/height away from the edges, so defects never touch the
# frame (an inpainting artifact magnet in practice).
margin_fraction: 0.05

# count_range: how many defect instances to place per generated mask
# (inclusive on both ends) -- most real industrial defect images have one
# or two flaws, rarely more.
count_range: [1, 2]

shapes:
  # Scratch: a single straight-ish line at a random angle -- the most
  # common surface defect on metal/plastic parts.
  - name: scratch
    type: line
    weight: 0.4
    width_range: [2, 6] # px
    length_range: [40, 160] # px

  # Pit/dent: an elliptical blemish -- corrosion pits, impact dents,
  # blister marks.
  - name: pit
    type: ellipse
    weight: 0.3
    size_range: [10, 40] # px, both axes independently sampled from this range

  # Crack: a multi-segment random walk -- longer, more irregular than a
  # scratch, mimics stress-fracture branching without needing a dedicated
  # branching renderer.
  - name: crack
    type: polyline
    weight: 0.3
    width_range: [1, 4] # px
    length_range: [60, 200] # px, total path length across all segments
    segments_range: [3, 8] # number of straight sub-segments
