<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VLM Assistant Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  #log { border: 1px solid #ccc; border-radius: 6px; height: 60vh; overflow-y: auto; padding: 0.75rem; }
  .msg { margin: 0.4rem 0; }
  .msg .who { font-weight: 600; }
  .msg.user .who { color: #1a5fb4; }
  .msg.assistant.ok .who { color: #26a269; }
  .msg.assistant.fail .who { color: #c01c28; }
  .msg pre { background: #f6f6f6; padding: 0.4rem; border-radius: 4px; overflow-x: auto; margin: 0.25rem 0 0; }
  form { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  input[type=text] { flex: 1; padding: 0.5rem; }
  button { padding: 0.5rem 1rem; }
  #status { font-size: 0.85rem; color: #666; margin-bottom: 0.5rem; }
</style>
</head>
<body>
<h1>VLM Assistant</h1>
<div id="status">connecting...</div>
<div id="log"></div>
<form id="form">
  <input type="text" id="input" placeholder='напр. "покажи последние 10 дефектов crack" или "помощь"' autocomplete="off">
  <button type="submit">Отправить</button>
</form>

<script>
  const log = document.getElementById("log");
  const status = document.getElementById("status");
  const form = document.getElementById("form");
  const input = document.getElementById("input");

  function addMessage(who, cssClass, text, data) {
    const div = document.createElement("div");
    div.className = "msg " + cssClass;
    const whoSpan = document.createElement("span");
    whoSpan.className = "who";
    whoSpan.textContent = who + ": ";
    div.appendChild(whoSpan);
    div.appendChild(document.createTextNode(text));
    if (data !== undefined && data !== null && Object.keys(data).length > 0) {
      const pre = document.createElement("pre");
      pre.textContent = JSON.stringify(data, null, 2);
      div.appendChild(pre);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(proto + "//" + location.host + "/ws/chat");

  ws.onopen = () => { status.textContent = "connected"; };
  ws.onclose = () => { status.textContent = "disconnected"; };
  ws.onerror = () => { status.textContent = "connection error"; };

  ws.onmessage = (event) => {
    const result = JSON.parse(event.data);
    const cssClass = result.success ? "assistant ok" : "assistant fail";
    addMessage("assistant", cssClass, result.message, result.data);
  };

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || ws.readyState !== WebSocket.OPEN) return;
    addMessage("you", "user", text);
    ws.send(text);
    input.value = "";
  });
</script>
</body>
</html>
