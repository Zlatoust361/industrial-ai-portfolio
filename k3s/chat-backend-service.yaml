# k3s/chat-backend-service.yaml -- exposes chat-backend two ways:
# NodePort (operator's browser, off-node) and the Service's own
# in-cluster DNS name (vlm-inference reaches it -- not needed today, but
# free with any ClusterIP-backed Service; NodePort Services still get one).
apiVersion: v1
kind: Service
metadata:
  name: chat-backend
  namespace: vlm-edge
spec:
  type: NodePort
  selector:
    app: chat-backend
  ports:
    - port: 8100
      targetPort: 8100
      nodePort: 30810
